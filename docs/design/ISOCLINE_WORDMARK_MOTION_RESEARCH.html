<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8F3E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C0C10" media="(prefers-color-scheme: dark)">
<title>Isocline Research · Wordmark Motion</title>
<!--
  ISOCLINE_WORDMARK_MOTION — Isocline RESEARCH, 70 scenes, one still word.

  Structure is the retired archive/ISOCLINE_TITLE_ANIMATION.html, restyled for Paper & Instrument
  (ISOCLINE_DESIGN_SYSTEM.html §02):
    · the word never moves. It is ONLY the master outline (brand/isocline-marks.js, via Path2D).
      What changes is its rendering — ink, engraved hairline, emboss — chosen by the scene on screen
      and settled slowly. No per-letter colour, no shadow, no glow, no gradient inside the letters.
    · the OKLCH dial keeps turning underneath (ThemeEngine port: hold L, rotate H). Day paper stays
      cream at every dial position; night paper takes the seed hue.
    · the old "beats" are 70 scenes, drawn as hairline instrument plates on the paper, in chapters
      taken from the design docs:  PRELUDE · THE WORD (what an isocline is) · LINEAGE (survey,
      telemetry, Rayo, the 1968 envelope, Conway, Cassils) · THE WORK (Bateman curve → readout) ·
      DECISIONS (Aug–Oct 2026 identity history, the eight dial stops, renderings, arms, discretion,
      voice) · CLOSE.
    · pacing is deliberate: long holds, then runs of 1–1.5 s scenes, then a slow-down. Every
      crossfade is as long as the shorter of its two scenes allows, so quick runs stay quiet and slow
      scenes dissolve. Scenes that share a base (slope field, hero curve, dial) share it through a
      layer, so a crossfade never dips.
    · clear space (the cap height of the O) is honoured: scenes are engraved around the lockup and
      nothing enters it, except the one diagram that is about the clear space.
    · the arm descriptor is RESEARCH (mono, never a different mark); it lets go for emboss, the
      discretion rendering, which names nothing.
    · lineage scenes follow §12: the 1968 envelope is honoured by its shape, not by name. §12 is
      "internal and Research about only" — set LINEAGE = false below to drop those scenes from a
      public cut.
    · prefers-reduced-motion: one still frame — ink word, LABS, the hairline and its point.
    · no on-screen text besides the lockup itself (the scene counter / caption readout was removed for deployment).
    · debug (optional):  #t=SECONDS to start there, &freeze=1 to hold a frame.
-->

<body>
<canvas id="c" role="img" aria-label="The Isocline wordmark with its RESEARCH descriptor, still, on paper. Around it, in hairline, a long sequence of instrument plates from the brand's history — slope fields, survey contours, a synthesizer envelope, the Bateman curve, the dial's eight stops — fades in and out while the hue dial slowly turns and the word changes only its rendering: ink, engraved hairline, embossed relief."></canvas>

<script src="tokens/isocline.tokens.js"></script>
<script src="brand/isocline-marks.js"></script>
<script>
"use strict";
(function () {
  var T = window.ISOCLINE_TOKENS, M = window.ISOCLINE_MARKS;
  if (!T || !M) return;
  var ARM = "RESEARCH";                         // arm descriptor: "LABS" · "RESEARCH" · "" (the app: wordmark alone)
  var ARMIDX = ARM === "" ? 0 : ARM === "RESEARCH" ? 1 : 2;
  var LINEAGE = true;                       // §12 lineage scenes (internal / Research "about" only)
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var RM = false;
  try { RM = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var qs = {};
  (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) qs[a[0]] = a[1]; });
  var TAU = 6.283185307179586;

  /* ---------- small math ---------- */
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function seg(k, a, b) { return clamp((k - a) / (b - a), 0, 1); }
  function ss(x) { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); }      // smootherstep
  function ease(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function rng(seed) { var s = seed >>> 0; return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

  /* ---------- ThemeEngine port: OKLCH -> sRGB, hold L, rotate H ---------- */
  function lin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function gam(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(Math.max(0, c), 1 / 2.4) - 0.055; }
  function toLinear(L, C, H) {
    var h = H * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
    var l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3),
        m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3),
        s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  }
  function inGamut(L, C, H) { return toLinear(L, C, H).every(function (v) { return v >= -1e-4 && v <= 1 + 1e-4; }); }
  function clampC(L, C, H) {
    if (inGamut(L, C, H)) return C;
    var lo = 0, hi = C, best = 0;
    for (var i = 0; i < 12; i++) { var mid = (lo + hi) / 2; if (inGamut(L, mid, H)) { best = mid; lo = mid; } else hi = mid; }
    return best;
  }
  function rgb(L, C, H) {
    C = clampC(L, C, H);
    return toLinear(L, C, H).map(function (v) { return Math.round(gam(Math.min(Math.max(v, 0), 1)) * 255); });
  }
  function hueOf(hx) {
    var r = lin(parseInt(hx.substr(1, 2), 16) / 255), g = lin(parseInt(hx.substr(3, 2), 16) / 255), b = lin(parseInt(hx.substr(5, 2), 16) / 255);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b),
        m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b),
        s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    var A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
    return (Math.atan2(B, A) * 180 / Math.PI + 360) % 360;
  }
  var DEFAULT = hueOf(T.seed.defaultHex);                 // the dial opens on-brand, then turns
  function resolve(seed, ap) {
    var o = {};
    Object.keys(T.recipes).forEach(function (k) {
      var r = T.recipes[k][ap], abs = (T.recipes[k].hue || {})[ap] === "absolute";
      o[k] = rgb(r[0], r[1], (((abs ? 0 : seed) + r[2]) % 360 + 360) % 360);
    });
    return o;
  }
  function rgba(c, a) { return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + (a == null ? 1 : a) + ")"; }
  function hexA(h, a) { return rgba([parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)], a); }
  function mixc(a, b, f) { return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)]; }

  /* palette at a hue and a day→night mix n (0 = day paper, 1 = night paper) */
  function makePal(hue, n) {
    var Lt = resolve(hue, "light"), Dk = resolve(hue, "dark"), C = {};
    Object.keys(Lt).forEach(function (k) { C[k] = mixc(Lt[k], Dk[k], n); });
    var ink = C.ink, ia = T.inkAlpha;
    function al(k) { return lerp(ia[k][0], ia[k][1], n); }
    var P = {};
    P.paper = function (a) { return rgba(C.paper, a); };
    P.card = function (a) { return rgba(C.card, a); };
    P.ink = function (a) { return rgba(ink, a); };
    P.muted = function (m) { return rgba(ink, al("muted") * (m == null ? 1 : m)); };
    P.faint = function (m) { return rgba(ink, al("faint") * (m == null ? 1 : m)); };
    P.line = function (m) { return rgba(ink, al("line") * (m == null ? 1 : m)); };
    P.grid = function (m) { return rgba(ink, al("grid") * (m == null ? 1 : m)); };
    P.acc = function (a) { return rgba(C.accent, a); };
    P.acc2 = function (a) { return rgba(C.accent2, a); };
    P.low = function (a) { return rgba(C.levelLow, a); };
    P.high = function (a) { return rgba(C.levelHigh, a); };
    P.onAcc = function (a) { return rgba(C.onAccent, a); };
    P.safety = function (a) { return rgba(C.safety, a); };
    P.lh = function (f, a) { return rgba(mixc(C.levelLow, C.levelHigh, f), a); };
    P.at = function (h, a) {                             // the accent recipe at any seed hue
      var r = T.recipes.accent, l = rgb(r.light[0], r.light[1], (((h + r.light[2]) % 360) + 360) % 360),
          d = rgb(r.dark[0], r.dark[1], (((h + r.dark[2]) % 360) + 360) % 360);
      return rgba(mixc(l, d, n), a);
    };
    return P;
  }

  /* ---------- the word: only ever the master outline ---------- */
  var VBW = M.wordmark.viewBox.split(" ").map(Number), VW = VBW[2], VH = VBW[3], CX = VBW[0] + VW / 2, CY = VBW[1] + VH / 2;
  var wordPath = new Path2D(M.wordmark.d);
  var VBM = M.mark.viewBox.split(" ").map(Number), markPath = new Path2D(M.mark.d);

  function paintShape(c, P, path, mode, wt, pxu, off, nn) {
    if (wt < 0.004) return;
    var A0 = c.globalAlpha, E = T.logo.emboss;
    if (mode === "emb") {
      var ea = wt * nn;
      if (ea > 0.004) {                                   // inkless relief: light plate up-left, shadow down-right, paper on top
        c.globalAlpha = A0 * ea * E.lightOpacity; c.save(); c.translate(-off, -off); c.fillStyle = E.light; c.fill(path); c.restore();
        c.globalAlpha = A0 * ea * E.shadowOpacity; c.save(); c.translate(off, off); c.fillStyle = E.shadow; c.fill(path); c.restore();
        c.globalAlpha = A0 * ea; c.fillStyle = P.paper(); c.fill(path);
      }
    } else if (mode === "hair") {                          // engraved hairline, like a survey plate
      c.globalAlpha = A0 * wt; c.strokeStyle = P.ink(); c.lineWidth = 1.4 / pxu; c.lineJoin = c.lineCap = "round"; c.stroke(path);
    } else {                                               // ink on paper
      c.globalAlpha = A0 * wt; c.fillStyle = P.ink(); c.fill(path);
    }
    c.globalAlpha = A0;
  }
  /* the small mark "I." at a size in px, centred on (x, y) */
  function drawMark(c, P, x, y, size, mode, wt, nn) {
    var sc = size / VBM[2];
    c.globalAlpha = G.a;
    c.save(); c.translate(x, y); c.scale(sc, sc); c.translate(-(VBM[0] + VBM[2] / 2), -(VBM[1] + VBM[3] / 2));
    paintShape(c, P, markPath, mode, wt == null ? 1 : wt, sc, Math.max(1.2, size * 0.035) / sc, nn == null ? 1 : nn);
    c.restore();
  }
  function drawWordmarkAt(c, P, x, y, w, mode) {         // ink rendering of the lockup at an exact px width
    var s = w / VW; c.globalAlpha = G.a;
    c.save(); c.translate(x, y); c.scale(s, s); c.translate(-CX, -CY);
    paintShape(c, P, wordPath, mode, 1, s, 1, 1);
    c.restore();
  }

  /* ---------- canvas + layout ---------- */
  var W = 0, H = 0, DPR = 1, Ly = {};
  function layout() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    var w = Math.max(96, Math.min(W * 0.62, 640)), s = w / VW, cx = W / 2, cy = H * 0.44, cap = 700 * s;
    var fs = Math.max(10, Math.min(24, w * 0.037)), gap = Math.max(8, w * 0.033);
    var wordTop = cy - 361 * s, wordBot = cy + 361 * s, descBot = ARM ? wordBot + gap + fs : wordBot;
    var u = clamp(Math.min(W, H) / 900, 0.62, 1.35);
    Ly = { w: w, s: s, cx: cx, cy: cy, cap: cap, fs: fs, gap: gap, wordTop: wordTop, wordBot: wordBot, descBot: descBot, u: u,
           x0: cx - w / 2 - cap, x1: cx + w / 2 + cap, y0: wordTop - cap, y1: descBot + cap };
    var bY1 = H - 84, bY0 = Ly.y1 + (bY1 - Ly.y1) * 0.08;
    if (bY1 - bY0 < 96) bY0 = bY1 - 96;
    Ly.cb = { x0: W * 0.09, x1: W * 0.91, y0: bY0, y1: bY1 };                       // bottom chart box
    var tY0 = 38, tY1 = Math.max(tY0 + 80, Ly.y0 - 26);
    Ly.ct = { x0: W * 0.09, x1: W * 0.91, y0: tY0, y1: tY1 };                       // top chart box
    Ly.baseY = clamp(Ly.y1 + (H - Ly.y1) * 0.42, Ly.y1 + 18, H - 74);
  }
  addEventListener("resize", layout);
  layout();
  ["500 12px 'IBM Plex Mono'", "400 12px 'IBM Plex Mono'", "400 12px 'IBM Plex Serif'", "400 12px 'Atkinson Hyperlegible Next'", "700 12px 'Atkinson Hyperlegible Next'"].forEach(function (f) { try { document.fonts.load(f); } catch (e) {} });

  /* chart-box mapping helpers */
  function bx(f) { return Ly.cb.x0 + f * (Ly.cb.x1 - Ly.cb.x0); }
  function by(v) { return Ly.cb.y1 - v * (Ly.cb.y1 - Ly.cb.y0); }
  function tbx(f) { return Ly.ct.x0 + f * (Ly.ct.x1 - Ly.ct.x0); }
  function cbw() { return Ly.cb.x1 - Ly.cb.x0; }
  function cbh() { return Ly.cb.y1 - Ly.cb.y0; }
  function pathFn(c, fn, f0, f1, n, X, Y) {
    c.beginPath();
    for (var i = 0; i <= n; i++) { var f = f0 + (f1 - f0) * i / n, x = X(f), y = Y(fn(f)); if (i) c.lineTo(x, y); else c.moveTo(x, y); }
  }
  function sig(f) { return 1 / (1 + Math.exp(-9 * (f - 0.45))); }
  function isoV(f) { var a = sig(0), b = sig(1); return 0.08 + 0.80 * (sig(f) - a) / (b - a); }   // rise into plateau
  function isoY(f) { return Ly.cb.y1 - isoV(f) * cbh(); }

  /* ---------- pharmacokinetics (Bateman) ---------- */
  function batN(x, ka, ke) {
    if (x <= 0) return 0;
    var tm = Math.log(ka / ke) / (ka - ke), pk = Math.exp(-ke * tm) - Math.exp(-ka * tm);
    return (Math.exp(-ke * x) - Math.exp(-ka * x)) / pk;
  }
  var HERO = (function () {
    var days = 8, tau = 1.5, ka = 2.4, ke = 0.55, m = 240, s = [], mx = 0, i, j;
    for (i = 0; i <= m; i++) { var x = i / m * days, v = 0; for (j = 0; j * tau <= x; j++) v += batN(x - j * tau, ka, ke); s.push(v); mx = Math.max(mx, v); }
    for (i = 0; i <= m; i++) s[i] /= mx;
    var peaks = [], troughs = [], mean = 0, cnt = 0;
    for (i = 1; i < m; i++) {
      var f = i / m;
      if (f > 0.5) { mean += s[i]; cnt++; }
      if (f > 0.5 && s[i] > s[i - 1] && s[i] >= s[i + 1]) peaks.push(f);
      if (f > 0.5 && s[i] < s[i - 1] && s[i] <= s[i + 1]) troughs.push(f);
    }
    var doses = []; for (j = 0; j * tau < days; j++) doses.push(j * tau / days);
    return { s: s, m: m, peaks: peaks, troughs: troughs, mean: mean / cnt, doses: doses,
             at: function (f) { var q = clamp(f, 0, 1) * m, a = Math.floor(q), b = Math.min(m, a + 1); return lerp(s[a], s[b], q - a); } };
  })();

  /* ---------- the drawing kit handed to every scene ---------- */
  var G = { c: ctx, P: null, L: null, a: 1, now: 0, k: 0, lk: 0, fset: false, fx: 0, fy: 0 };
  var layerA = {}, layerBirth = {}, layerPrev = {}, layerDone = {};
  G.al = function (x) { ctx.globalAlpha = clamp(G.a * x, 0, 1); };
  G.focus = function (x, y) { G.fset = true; G.fx = x; G.fy = y; };
  G.ln = function (x1, y1, x2, y2, col, w) { ctx.strokeStyle = col || G.P.line(); ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  G.ring = function (x, y, r, col, w, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.strokeStyle = col || G.P.ink(); ctx.lineWidth = w || 1; ctx.stroke(); };
  G.disc = function (x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); ctx.fillStyle = col; ctx.fill(); };
  G.rr = function (x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  function fontOf(o) {
    var sz = o.size || 11, f = o.font;
    if (f === "serif") return "400 " + sz + "px 'IBM Plex Serif', Georgia, serif";
    if (f === "sans") return (o.wt || 400) + " " + sz + "px 'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif";
    return (o.wt || 400) + " " + sz + "px 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace";
  }
  G.meas = function (s, o) {
    o = o || {}; ctx.font = fontOf(o);
    var tr = (o.track == null ? (o.font ? 0 : 0.12) : o.track) * (o.size || 11);
    if (!tr) return ctx.measureText(s).width;
    var t = -tr; for (var i = 0; i < s.length; i++) t += ctx.measureText(s[i]).width + tr; return t;
  };
  G.tx = function (s, x, y, o) {                          // tracked text; align l|c|r
    o = o || {}; ctx.font = fontOf(o); ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    var tr = (o.track == null ? (o.font ? 0 : 0.12) : o.track) * (o.size || 11), tot = G.meas(s, o);
    var x0 = o.align === "c" ? x - tot / 2 : o.align === "r" ? x - tot : x;
    ctx.fillStyle = o.col || G.P.muted();
    var vis = o.n == null ? s.length : Math.max(0, Math.min(s.length, o.n));
    if (!tr && vis >= s.length) { G.al(o.a == null ? 1 : o.a); ctx.fillText(s, x0, y); return tot; }
    for (var i = 0; i < s.length; i++) {
      var w = ctx.measureText(s[i]).width, fa = o.stag ? clamp(vis - i, 0, 1) : (i < vis ? 1 : 0);
      if (fa > 0) { G.al((o.a == null ? 1 : o.a) * fa); ctx.fillText(s[i], x0, y); }
      x0 += w + tr;
    }
    return tot;
  };
  G.fit = function (s, o, maxW) { o = Object.assign({}, o); while (G.meas(s, o) > maxW && o.size > 8) o.size *= 0.93; return o; };
  G.layer = function (name, fn) {
    if (layerDone[name]) return; layerDone[name] = 1;
    var sv = G.a, svk = G.lk; G.a = layerA[name] || 0; G.lk = G.now - (layerBirth[name] || 0);
    ctx.save(); ctx.globalAlpha = G.a; fn(G); ctx.restore(); G.a = sv; G.lk = svk;
  };
  G.stroke = function () {                                // level sweep: levelLow → levelHigh along the chart
    var g = ctx.createLinearGradient(Ly.cb.x0, 0, Ly.cb.x1, 0); g.addColorStop(0, G.P.low()); g.addColorStop(1, G.P.high()); return g;
  };
  G.nowPoint = function (x, y, sc, a) {                   // the concentric point: 15% halo + solid dot
    var NP = T.curve.nowPoint;
    ctx.save();
    ctx.globalAlpha = clamp(G.a * (a == null ? 1 : a) * NP.haloOpacity, 0, 1); G.disc(x, y, NP.haloDiameter / 2 * sc, G.P.acc());
    ctx.globalAlpha = clamp(G.a * (a == null ? 1 : a), 0, 1); G.disc(x, y, NP.dotDiameter / 2 * sc, G.P.lh(0));
    ctx.restore();
  };

  /* ---------- shared layers ---------- */
  function baselineLayer(g) { g.ln(0, Ly.baseY, W, Ly.baseY, g.P.line(), 1); }          // the isocline: one hairline of equal slope

  function fieldLayer(g) {                                 // slope field converging on the isocline
    var c = g.c, P = g.P, u = Ly.u, cb = Ly.cb, bh = cbh(), lk = g.lk;
    var cols = Math.max(9, Math.round(W / 84)), rows = 7, len = 8 * u;
    c.lineCap = "round"; c.lineWidth = 1.4; c.strokeStyle = P.faint();
    for (var i = 0; i < cols; i++) {
      var fx = i / (cols - 1), rv = ss(seg(lk, fx * 2.0, fx * 2.0 + 1.3)); if (rv <= 0) continue;
      var x = W * (0.04 + 0.92 * fx), f = clamp((x - cb.x0) / cbw(), 0, 1), yc = isoY(f);
      for (var j = 0; j < rows; j++) {
        var y = cb.y0 - bh * 0.35 + j / (rows - 1) * bh * 1.4, dd = (y - yc) / bh;
        if (Math.abs(dd) < 0.07) continue;
        var mag = Math.min(0.65, Math.abs(dd) * 1.5) + 0.06,
            ang = (dd > 0 ? -mag : mag) + 0.05 * Math.min(1, Math.abs(dd) * 4) * Math.sin(g.now / 0.9 + x * 0.004 + y * 0.003);
        g.al(0.9 * rv);
        c.beginPath(); c.moveTo(x - Math.cos(ang) * len, y - Math.sin(ang) * len); c.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); c.stroke();
      }
    }

    LOOP = t0 + 0;                                          // the last seam is the wrap seam: scene 1 begins as the last one lets go
  })();
  function envOf(i, tt) {
    var s = ST[i], x = tt - s.start, d = SC[i].d;
    if (x < 0 || x > d) return 0;
    return ss(x / s.fin) * ss((d - x) / s.fout);
  }

  /* ---------- word rendering, ground, point: all settled, none snapped ---------- */
  var curR = "ink", wts = [1, 0, 0], night = 0, dot = { x: W / 2, y: Ly.baseY, a: 0 }, clock = qs.t ? parseFloat(qs.t) || 0 : 0, last = 0, firstFrame = true, FREEZE = !!qs.freeze, hue = DEFAULT;
  var RIDX = { ink: 0, hair: 1, emb: 2 };

  function frame(nowT) {
    if (!last) last = nowT;
    var dt = Math.min(0.1, (nowT - last) / 1000); last = nowT;
    if (!FREEZE && !RM) clock += dt;
    var snap = firstFrame || FREEZE; firstFrame = false;
    G.now = clock;
    hue = RM ? DEFAULT : (DEFAULT + clock / (LOOP / 3) * 360) % 360; G.hue = hue;

    /* which scenes are on */
    var tau = RM ? 0 : clock % LOOP, firstPass = clock < LOOP, active = [], i;
    for (i = 0; i < N; i++) {
      var a = envOf(i, tau), k = tau - ST[i].start;
      if (!firstPass || clock < 0) { var a2 = envOf(i, tau + LOOP); if (a2 > a) { a = a2; k = tau + LOOP - ST[i].start; } }
      if (a > 0.004) active.push({ i: i, a: a, k: k });
    }
    if (RM) active = [{ i: N - 1, a: 1, k: SC[N - 1].d * 0.5 }];

    /* ground, rendering and layer alphas from what is on screen */
    var nT = 0, rT = null, rBest = 0, layers = {}, ln;
    active.forEach(function (q) {
      var s = SC[q.i]; nT += q.a * s.n;
      if (s.r && q.a > rBest) { rBest = q.a; rT = s.r; }
      if (s.lay) (Array.isArray(s.lay) ? s.lay : [s.lay]).forEach(function (nm) { layers[nm] = Math.max(layers[nm] || 0, q.a); });
    });
    nT = clamp(nT, 0, 1);
    night += (nT - night) * (snap ? 1 : 1 - Math.exp(-dt / 0.7)); G.n = night;
    Object.keys(layerPrev).concat(Object.keys(layers)).forEach(function (nm) {
      var na = layers[nm] || 0; if (!(layerPrev[nm] > 0) && na > 0) layerBirth[nm] = clock; layerPrev[nm] = na;
    });
    layerA = layers; layerDone = {};
    if (rT != null) curR = rT; rT = curR;
    var tw = [0, 0, 0]; tw[RIDX[rT]] = 1;
    var rk = snap ? 1 : 1 - Math.exp(-dt / 1.0); for (i = 0; i < 3; i++) wts[i] += (tw[i] - wts[i]) * rk;

    var P = makePal(hue, night); G.P = P; G.L = Ly;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
    ctx.fillStyle = P.paper(); ctx.fillRect(0, 0, W, H);
    document.body.style.background = P.paper();

    /* scenes, engraved around the lockup's clear space */
    var foci = [];
    function run(q) {
      G.a = q.a; G.k = q.k; G.fset = false;
      ctx.save(); ctx.globalAlpha = q.a; ctx.lineCap = "butt"; ctx.lineJoin = "miter"; ctx.setLineDash([]);
      SC[q.i].fn(G, clamp(q.k / SC[q.i].d, 0, 1), q.k, SC[q.i].d);
      ctx.restore();
      if (G.fset) foci.push({ x: G.fx, y: G.fy, a: q.a });
    }
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(Ly.x0, Ly.y0, Ly.x1 - Ly.x0, Ly.y1 - Ly.y0); ctx.clip("evenodd");
    active.forEach(function (q) { if (!SC[q.i].nc) run(q); });
    ctx.restore();
    active.forEach(function (q) { if (SC[q.i].nc) run(q); });
    ctx.globalAlpha = 1;

    /* the word — still. Width stays within brand bounds (≥96px); only its rendering moves. */
    var s = Ly.s, cx = Ly.cx, cy = Ly.cy, wInk = wts[0] + wts[2] * night, wHair = wts[1], wEmb = wts[2];
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-CX, -CY);
    paintShape(ctx, P, wordPath, "emb", wEmb, s, VW * T.logo.emboss.largeDepthRatio, 1 - night);
    paintShape(ctx, P, wordPath, "hair", wHair, s, 1, 1);
    paintShape(ctx, P, wordPath, "ink", wInk, s, 1, 1);
    ctx.restore();
    /* the arm — LABS, a mono descriptor, never a different mark. It lets go for emboss, which names nothing. */
    var dA = Math.min(1, wInk + wHair);
    if (dA > 0.004 && ARM) {
      var fs = Ly.fs, track = 0.42 * fs, txt = ARM, yB = Ly.wordBot + Ly.gap + fs, ws = [], tot = -track, j;
      ctx.font = "500 " + fs + "px 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      for (j = 0; j < txt.length; j++) { var cw = ctx.measureText(txt[j]).width; ws.push(cw); tot += cw + track; }
      var dx = cx - tot / 2; ctx.globalAlpha = dA; ctx.fillStyle = P.ink();
      for (j = 0; j < txt.length; j++) { ctx.fillText(txt[j], dx, yB); dx += ws[j] + track; }
      ctx.globalAlpha = 1;
    }

    /* the one plotted point — it glides from each scene's focus to the next, never jumps */
    var fw = 0, fx = 0, fy = 0, fa = 0;
    foci.forEach(function (q) { fw += q.a; fx += q.x * q.a; fy += q.y * q.a; fa = Math.max(fa, q.a); });
    if (fw > 0) {
      fx /= fw; fy /= fw;
      var ink = Math.min(1, dot.a + 1);
      if (dot.a < 0.01 && fa > 0) { dot.x = fx; dot.y = fy; }
      var dk = snap ? 1 : 1 - Math.exp(-dt / 0.55); dot.x += (fx - dot.x) * dk; dot.y += (fy - dot.y) * dk;
    }
    dot.a += (fa - dot.a) * (snap ? 1 : 1 - Math.exp(-dt / 0.4));
    var px = dot.x, py = dot.y;
    if (px > Ly.x0 && px < Ly.x1 && py > Ly.y0 && py < Ly.y1) {         // nothing enters the clear space
      var dl = px - Ly.x0, dr = Ly.x1 - px, dtp = py - Ly.y0, db = Ly.y1 - py, mn = Math.min(dl, dr, dtp, db);
      if (mn === dl) px = Ly.x0; else if (mn === dr) px = Ly.x1; else if (mn === dtp) py = Ly.y0; else py = Ly.y1;
    }
    if (dot.a > 0.004) {
      var NP = T.curve.nowPoint, breath = RM ? 0 : Math.sin(clock / 0.7) * 1.2;
      ctx.globalAlpha = NP.haloOpacity * dot.a; ctx.fillStyle = P.acc(); ctx.beginPath(); ctx.arc(px, py, NP.haloDiameter * 0.62 + breath, 0, TAU); ctx.fill();
      ctx.globalAlpha = dot.a; ctx.fillStyle = P.lh(0); ctx.beginPath(); ctx.arc(px, py, NP.dotDiameter * 0.62 / 2, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    }

    if (!RM) requestAnimationFrame(frame);
  }

  if (qs.debug) window.__iso = { SC: SC, ST: ST, LOOP: LOOP, N: N, set: function (t) { clock = t; } };
  requestAnimationFrame(frame);
  if (RM) setTimeout(function () { requestAnimationFrame(frame); }, 600);
})();
</script>
