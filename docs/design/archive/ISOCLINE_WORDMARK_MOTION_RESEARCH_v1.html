<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8F3E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C0C10" media="(prefers-color-scheme: dark)">
<title>Isocline · Wordmark Motion Study</title>
<!--
  ISOCLINE_WORDMARK_MOTION — the sedentary successor to
  archive/ISOCLINE_TITLE_ANIMATION.html (the retired typed-with-curve piece).

  What the archive did that this study will not (per ISOCLINE_DESIGN_SYSTEM.html §02):
    · typed "ISOCLINE" as live text, per-letter colors  → never re-type the logo.
      Here the word is ONLY the master outline from brand/isocline-marks.js,
      via Path2D. Its shape cannot change; only rendering does.
    · decorated the word (shadow, per-letter color field) → no glow, no shadow,
      no gradient inside the letters. Ink, engraved hairline, emboss relief —
      the three sanctioned renderings, cross-faded slowly.
    · a curve under the word (the retired lockup) → the ground stays paper.
      The only mark on the ground is a single horizontal hairline — an isocline:
      a line of equal slope — with the brand's plotted point riding it,
      the same perfect-circle point as the "I." of the mark.

  The word stays still while the OKLCH dial turns underneath it — that was
  always the idea; this piece finally takes it literally. Discretion, day
  paper (cream at every dial position), night paper via the system, and
  prefers-reduced-motion: static, on-brand, ink.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens/isocline.css">
<style>
html, body { height: 100%; }
body { margin: 0; background: var(--paper); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#hud {
  position: fixed; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 11px/1.55 "IBM Plex Mono", "SF Mono", ui-monospace, monospace; letter-spacing: .08em;
  color: var(--ink); opacity: .6; pointer-events: none; white-space: pre;
}
#study {
  position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 10px/1.5 "IBM Plex Mono", "SF Mono", ui-monospace, monospace; letter-spacing: .1em;
  color: var(--ink); opacity: .42; pointer-events: auto;
}
#study a { color: inherit; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="The Isocline wordmark with its RESEARCH arm descriptor, still, while its seed hue and rendering — ink, engraved hairline, embossed relief — slowly change. Below it a single hairline carries one plotted point at a steady pace."></canvas>
<div id="hud" aria-hidden="true"></div>
<!--<div id="study"><a href="ISOCLINE_DESIGN_SYSTEM.html">WORDMARK MOTION STUDY · SEE ISOCLINE_DESIGN_SYSTEM §02</a></div> -->

<script src="tokens/isocline.tokens.js"></script>
<script src="brand/isocline-marks.js"></script>
<script>
"use strict";
(function () {
  var T = window.ISOCLINE_TOKENS, M = window.ISOCLINE_MARKS;
  if (!T || !M) return;
  var cv = document.getElementById("c"), ctx = cv.getContext("2d"), hud = document.getElementById("hud");
  var RM = false;
  try { RM = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  /* ---------- ThemeEngine port: OKLCH -> sRGB, hold L, rotate H ---------- */
  function lin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function gam(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(Math.max(0, c), 1 / 2.4) - 0.055; }
  function toLinear(L, C, H) {
    var h = H * Math.PI / 180, a = C * Math.cos(h), b = C * Math.sin(h);
    var l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3),
        m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3),
        s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  }
  function inGamut(L, C, H) { return toLinear(L, C, H).every(function (v) { return v >= -1e-4 && v <= 1 + 1e-4; }); }
  function clampC(L, C, H) {
    if (inGamut(L, C, H)) return C;
    var lo = 0, hi = C, best = 0;
    for (var i = 0; i < 12; i++) { var mid = (lo + hi) / 2; if (inGamut(L, mid, H)) { best = mid; lo = mid; } else hi = mid; }
    return best;
  }
  function rgb(L, C, H) {
    C = clampC(L, C, H);
    return toLinear(L, C, H).map(function (v) { return Math.round(gam(Math.min(Math.max(v, 0), 1)) * 255); });
  }
  function hex(c) { return "#" + c.map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join("").toUpperCase(); }
  function hueOf(hx) {
    var r = lin(parseInt(hx.substr(1, 2), 16) / 255), g = lin(parseInt(hx.substr(3, 2), 16) / 255), b = lin(parseInt(hx.substr(5, 2), 16) / 255);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b),
        m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b),
        s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    var A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
    return (Math.atan2(B, A) * 180 / Math.PI + 360) % 360;
  }
  var DEFAULT = hueOf(T.seed.defaultHex);   // the dial opens on-brand, then turns
  function resolve(seed, appearance) {
    var out = {};
    Object.keys(T.recipes).forEach(function (k) {
      var r = T.recipes[k][appearance], abs = (T.recipes[k].hue || {})[appearance] === "absolute";
      out[k] = rgb(r[0], r[1], (((abs ? 0 : seed) + r[2]) % 360 + 360) % 360);
    });
    var ink = out.ink;
    Object.keys(T.inkAlpha).forEach(function (k) {
      out[k] = { css: "rgba(" + ink.join(", ") + ", " + T.inkAlpha[k][appearance === "dark" ? 1 : 0] + ")", a: T.inkAlpha[k][appearance === "dark" ? 1 : 0] };
    });
    Object.keys(T.recipes).forEach(function (k) { out[k] = { css: hex(out[k]), a: 1 }; });
    return out;
  }

  /* ---------- the word: only ever the master outline ---------- */
  var D = M.wordmark.d, VB = M.wordmark.viewBox.split(" ").map(Number);
  var VW = VB[2], VH = VB[3], CX = VB[0] + VW / 2, CY = VB[1] + VH / 2;
  var path = new Path2D(D);

  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
  }
  addEventListener("resize", resize);
  resize();

  /* timing */
  var HUE_MS = 64000;    // one calm dial turn
  var RCYC = 48000;      // one rendering cycle per turn and a half

  /* rendering weights: ink -> hairline -> emboss -> ink, held long, faded slow.
     Emboss only reads on day paper; at night its weight joins ink. */
  var KEYS = [
    [0.00, [1, 0, 0]], [0.45, [1, 0, 0]],
    [0.53, [0, 1, 0]], [0.62, [0, 1, 0]],
    [0.70, [0, 0, 1]], [0.86, [0, 0, 1]],
    [0.94, [1, 0, 0]], [1.00, [1, 0, 0]]
  ];
  function smooth(x) { return x * x * (3 - 2 * x); }
  function weights(u) {
    var i = 0;
    while (i < KEYS.length - 2 && u > KEYS[i + 1][0]) i++;
    var a = KEYS[i], b = KEYS[i + 1], f = smooth(Math.min(1, Math.max(0, (u - a[0]) / (b[0] - a[0]))));
    return [
      a[1][0] + (b[1][0] - a[1][0]) * f,
      a[1][1] + (b[1][1] - a[1][1]) * f,
      a[1][2] + (b[1][2] - a[1][2]) * f
    ];
  }

  var night = false;
  try { night = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}

  var started = 0;
  function frame(nowT) {
    if (!started) started = nowT;
    var t = RM ? 0 : nowT - started;
    var hue = RM ? DEFAULT : (DEFAULT + t / HUE_MS * 360) % 360;
    var pal = resolve(hue, night ? "dark" : "light");

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = pal.paper.css;
    ctx.fillRect(0, 0, W, H);

    /* the ground: one isocline — a hairline of equal (zero) slope — and the plotted
       point riding it at a steady pace. The same perfect-circle point as the "I." mark. */
    var yL = H * 0.76;
    ctx.strokeStyle = pal.line.css; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, yL); ctx.lineTo(W, yL); ctx.stroke();

    var p = RM ? 0.618 : (t / HUE_MS)  % 1,
        px = W * (0.06 + 0.88 * p),
        pa = RM ? 1 : Math.sin(Math.PI * p),
        NP = T.curve.nowPoint,
        halo = NP.haloDiameter * 0.62, dot = NP.dotDiameter * 0.62;
    if (pa > 0.004) {
      var breath = RM ? 0 : Math.sin(t / 700) * 1.2;
      ctx.fillStyle = pal.accent.css;
      ctx.globalAlpha = NP.haloOpacity * pa;
      ctx.beginPath(); ctx.arc(px, yL, halo + breath, 0, 6.283); ctx.fill();
      ctx.globalAlpha = pa;
      ctx.fillStyle = pal.levelLow.css;
      ctx.beginPath(); ctx.arc(px, yL, dot / 2, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* the wordmark — still. Width stays within brand bounds (≥96px), clear space is the page. */
    var w = Math.max(96, Math.min(W * 0.62, 640)),
        s = w / VW,
        cx = W / 2, cy = H * 0.44;
    var wts = weights(RM ? 0.10 : ((t % RCYC) / RCYC));
    var wInk = wts[0], wHair = wts[1], wEmb = wts[2];
    if (night) wInk += wEmb;              // relief only reads on day paper

    function drawWord(wInkA, wHairA, wEmbA) {
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-CX, -CY);

      if (wEmbA > 0.004) {                /* emboss: light plate up-left, ink shadow down-right, paper on top */
        var E = T.logo.emboss,
            off = VW * (VW > E.largeThreshold ? E.largeDepthRatio : E.depthRatio);
        ctx.globalAlpha = wEmbA;
        ctx.save(); ctx.translate(-off, -off); ctx.fillStyle = E.light; ctx.fill(path); ctx.restore();
        ctx.save(); ctx.translate(off, off); ctx.fillStyle = E.shadow; ctx.globalAlpha = wEmbA * 1; ctx.fill(path); ctx.restore();
        ctx.fillStyle = pal.paper.css; ctx.fill(path);
        ctx.globalAlpha = 1;
      }
      if (wHairA > 0.004) {               /* engraved hairline, like a survey plate */
        ctx.globalAlpha = wHairA;
        ctx.strokeStyle = pal.ink.css;
        ctx.lineWidth = 1.4 / s;
        ctx.lineJoin = ctx.lineCap = "round";
        ctx.stroke(path);
        ctx.globalAlpha = 1;
      }
      if (wInkA > 0.004) {                /* ink on paper — or seed-filled, nowhere in between on the letters */
        ctx.globalAlpha = wInkA;
        ctx.fillStyle = pal.ink.css;
        ctx.fill(path);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
    drawWord(wInk, wHair, night ? 0 : wEmb);

    /* the arm — "RESEARCH" as the mono descriptor, never a different mark (§03).
       Plex Mono, wide tracking, ink; it rides the ink and hairline phases and
       lets go for emboss, the discretion rendering, which names nothing. */
    var dAlpha = Math.min(1, wInk + wHair),
        wordBottom = cy + 361 * s;          // baseline side of the word box
    if (dAlpha > 0.004) {
      var fs = Math.max(10, Math.min(24, w * 0.037)),
          gap = Math.max(8, w * 0.033),
          track = 0.42 * fs,               // the arms plate tracking
          txt = "RESEARCH",
          yB = wordBottom + gap + fs,
          widths = [], tot = -track;
      ctx.font = "500 " + fs + "px 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      for (var i = 0; i < txt.length; i++) { var cw = ctx.measureText(txt[i]).width; widths.push(cw); tot += cw + track; }
      var dx = cx - tot / 2;
      ctx.globalAlpha = dAlpha;
      ctx.fillStyle = pal.ink.css;
      for (var j = 0; j < txt.length; j++) { ctx.fillText(txt[j], dx, yB); dx += widths[j] + track; }
      ctx.globalAlpha = 1;
    }

    var name = renderingName(wInk, wHair, wEmb);
  
    requestAnimationFrame(frame);
  }
  function renderingName(a, b, c) {
    var m = Math.max(a, b, c);
    if (m === a) return "INK";
    if (m === b) return "HAIRLINE";
    return "EMBOSS";
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
